name: CI — Security Lab (validación)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fusión: sustituye el validate.yml (check evidence) + mis tests MCP
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check evidence READMEs
        run: |
          set -e
          for d in evidence/*/; do
            if [ ! -f "$d/README.md" ]; then
              echo "FAIL: $d missing README.md"
              exit 1
            fi
          done
          echo "evidence READMEs OK"

      - name: MCP tools syntax
        run: |
          python -m py_compile mcp-server/mcp_server_tactical/tools/__init__.py
          python -m py_compile cve-triage/cve_triage.py
          bash -n batteries/battery-2026-08-10.sh
          bash -n scripts/case-nightly.sh
          echo "syntax OK (mcp, cve, battery, case)"

      - name: Kanban markdown integrity
        run: |
          test -f kanban-md/INDEX.md && echo "kanban INDEX OK"
          test -d kanban-md/ready && test -d kanban-md/done && echo "kanban dirs OK"
