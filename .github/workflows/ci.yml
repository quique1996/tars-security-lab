name: CI — Security Lab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  mcp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: MCP tools import
        run: |
          python -c "import ast,sys; ast.parse(open('mcp-server/mcp_server_tactical/tools/__init__.py').read()); print('MCP tools syntax OK')"
      - name: cve-triage compile
        run: python -m py_compile cve-triage/cve_triage.py && echo "cve_triage compile OK"
      - name: battery script syntax
        run: bash -n batteries/battery-2026-08-10.sh && echo "battery syntax OK"
  promptfoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: promptfoo redteam smoke
        run: |
          npm i -g promptfoo >/dev/null 2>&1
          promptfoo --version
          echo "promptfoo ready (configs: promptfooconfig*.yaml)"
