# Qdrant — Cognitive Core (Mac mini M4)
# Hard budget: 2 GB RAM max. Payload on disk, HNSW in RAM.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    environment:
      QDRANT__STORAGE__OPTIMIZER__MEM_MAP_THRESHOLD: "100000"   # force memmap (payload on disk)
      QDRANT__STORAGE__OPTIMIZER__INDEXING_THRESHOLD_KB: "20000"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  qdrant_storage:
  qdrant_snapshots:
